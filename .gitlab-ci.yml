stages:
  - code-checks
  - tests

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_PROJECT_ENVIRONMENT: "$CI_PROJECT_DIR/.venv"

.standard-rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - when: never

.base-uv-image:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  interruptible: true

.base-uv-full:
  extends: .base-uv-image
  cache:
    key: "uv-main-$CI_DEFAULT_BRANCH"
    paths:
      - .uv-cache/
      - .venv/
  before_script:
    - uv sync --locked --all-groups

.base-uv-tools:
  extends: .base-uv-image
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-tools-cache"
  cache:
    key: "uv-tools-$CI_DEFAULT_BRANCH"
    paths:
  before_script:
    - uv sync --locked --no-default-groups --group lint

lint:
  extends:
    - .base-uv-tools
    - .standard-rules
  stage: code-checks
  allow_failure: false
  script:
    - uv run -- ruff check src/ --output-format=gitlab > code-quality-report.json
  artifacts:
    reports:
      codequality: $CI_PROJECT_DIR/code-quality-report.json

format:
  extends:
    - .base-uv-tools
    - .standard-rules
  stage: code-checks
  allow_failure: false
  script:
    - uv run -- ruff format --diff

markdown-lint:
  extends:
    - .base-uv-tools
    - .standard-rules
  stage: code-checks
  allow_failure: false
  script:
    - uv run -- mdformat . --exclude .venv --exclude .pytest_cache --exclude .uv-cache

pytest:
  extends:
    - .base-uv-full
    - .standard-rules
  stage: tests
  services:
    - name: docker:20.10.23-dind-alpine3.17
      command:
        ["--registry-mirror", "https://foundationregistry.synchro.com.br"]
  variables:
    DOCKER_HOST: "tcp://docker:2375/"
    DOCKER_DRIVER: "overlay2"
    DOCKER_TLS_CERTDIR: ""
  script:
    - uv run -- pytest
  artifacts:
    paths:
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
