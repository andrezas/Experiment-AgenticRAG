[project]
name = "agent-rag"
version = "0.1.0"
description = "A concise description of the project."
readme = "README.md"
requires-python = ">= 3.13"
dependencies = [
    "colorlog>=6.10.1",
    "langchain>=1.3.2",
    "langchain-anthropic>=1.4.4",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.2.2",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.2.2",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "sentence-transformers>=5.5.1",
    "torch>=2.12.0",
    "tqdm>=4.67.3",
]

[dependency-groups]
base = [
  "beanie>=2.0",
  "httpx>=0.28.1",
  "psycopg[binary,pool]>=3.2.9",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.10.1",
  "qdrant-client>=1.15.0",
  "SQLAlchemy>=2.0.41",
  "termcolor>=3.1.0",
  "pydantic-extra-types>=2.10.5",
]
dev = [
  "pre-commit>=4.2.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=6.2.1",
  "pytest-mock>=3.14.0",
  "secscan-cli>=1.4.1",
]
lint = [
  "ruff>=0.15.0",
  "mdformat>=0.7.21",
  "mdformat-gfm>=0.3.8",
  "ty>=0.0.16",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "COM",
  "C90",
  "D",
  "DTZ",
  "E",
  "F",
  "FA",
  "FAST",
  "FBT",
  "FLY",
  "I",
  "ICN",
  "ISC",
  "INP",
  "N",
  "NPY",
  "PIE",
  "PD",
  "PERF",
  "PLR",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "TC",
  "TID",
  "TD",
  "UP"
]
preview = true

ignore = [
  "COM812",
  "D1",
  "D203",
  "D212",
  "EM101",
  "TD002",
  "TD003",
  "RUF029",
  "C901",
  "PLR0913",
  "PLR0914",
  "PLR0915",
  "PLR0917",
  "ASYNC230",
  "ASYNC240",
  "ARG005",
  "B905",
  "RET504",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",
  "ARG",
  "FBT",
  "PLR2004",
  "S311",
]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v -ra --cov=src --cov-report=term-missing --cov-report=xml"
filterwarnings = [
  "ignore::DeprecationWarning:lazy_model.*",
  "ignore::DeprecationWarning:pydantic.*",
  "ignore::DeprecationWarning:pydantic_core.*",
]
norecursedirs = [".git", ".tox", "dist", "build"]
# Enable these options if you want to see logs in the terminal during tests
log_cli = true
log_cli_level = "INFO"

[tool.ty.rules]
possibly-unresolved-reference = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
